services:
  mongo:
    image: mongo:7
    container_name: rbac-mongo
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    entrypoint: >
      bash -c "
        sleep 5 &&
        mongosh --host mongo:27017 --eval 'try { rs.status() } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}) }'
      "

  backend:
    build: ./backend
    container_name: rbac-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/rbac_doc_system?replicaSet=rs0
      - JWT_SECRET=change_this_to_a_long_random_string
      - PORT=5000
    depends_on:
      - mongo
      - mongo-init

volumes:
  mongo_data: