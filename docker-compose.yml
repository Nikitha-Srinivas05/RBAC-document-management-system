version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: rbac-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: rbac-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/rbac_doc_system
      - JWT_SECRET=change_this_to_a_long_random_string
      - PORT=5000
    depends_on:
      - mongo

volumes:
  mongo_data:
